# /etc/nginx/sites-available/supoclip.conf no servidor BVIP.
# HTTPS é adicionado pelo certbot (--nginx), que reescreve estes blocos com
# listen 443 ssl e o redirecionamento de 80 para 443.

# Frontend (Next.js)
server {
    listen 80;
    listen [::]:80;
    server_name supoclip.barbearia.vip;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:13107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# Backend (FastAPI): uploads de vídeo vêm direto do navegador (até 4 GB) e o
# progresso em tempo real usa SSE, por isso sem buffer e com timeouts longos.
server {
    listen 80;
    listen [::]:80;
    server_name api.supoclip.barbearia.vip;

    client_max_body_size 4G;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
