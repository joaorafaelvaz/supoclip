# Produção no servidor BVIP (supoclip.barbearia.vip, RTX 3060 12 GB). Carregado
# automaticamente pelo `docker compose`. Requer Compose v2.24+ (`!reset`),
# driver NVIDIA 580+ e nvidia-container-toolkit no host (torch 2.11 usa CUDA 13).
services:
  frontend:
    # A imagem `runner` já contém o build; sem montar o código-fonte.
    volumes: !reset []
    environment:
      DATABASE_URL: postgresql://supoclip:${POSTGRES_PASSWORD}@postgres:5432/supoclip

  backend:
    environment:
      DATABASE_URL: postgresql+asyncpg://supoclip:${POSTGRES_PASSWORD}@postgres:5432/supoclip
    volumes:
      # Modelo Whisper baixado uma única vez, mesmo após rebuilds.
      - whisper_cache:/root/.cache/whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker:
    environment:
      DATABASE_URL: postgresql+asyncpg://supoclip:${POSTGRES_PASSWORD}@postgres:5432/supoclip
    volumes:
      - whisper_cache:/root/.cache/whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    # Só a rede interna do Compose usa o Redis; não ocupar a porta 6379 do host
    # (outro serviço do servidor já a utiliza).
    ports: !reset []

volumes:
  whisper_cache:
    driver: local
